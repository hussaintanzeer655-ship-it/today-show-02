<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Today Show Live Cards</title><style>:root{--bg:#0b1020;--fg:#e9e3f9;--card:#151a31;--accent:#7c3aed;--shadow:0 6px 18px rgba(0,0,0,.25)}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui}header{position:sticky;top:0;background:#1f2340;padding:12px 16px;display:flex;gap:14px;align-items:center;justify-content:space-between} .brand{font-weight:700;letter-spacing:.4px} .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:16px} .card{background:var(--card);border-radius:12px;padding:14px;box-shadow:var(--shadow);border:1px solid #1f2141} .card h4{margin:0 0 6px} .tag{font-size:12px;background:#2a2751;color:#d1c4e9;padding:4px 8px;border-radius:999px} .row{display:flex;gap:8px;flex-wrap:wrap} .btn{border:1px solid #4b3a8a;background:#2e2a66;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer} @media (max-width:600px){.cards{grid-template-columns:1fr}} </style></head><body><header><div class="brand">Today Show</div><div class="row"><button class="btn" id="shuffle">Shuffle</button><button class="btn" id="theme">Theme</button></div></header><main class="cards" id="cards"></main><script>const data=[{t:'Headlines',m:'Top stories now'},{t:'Markets',m:'Live indices'},{t:'Weather',m:'Conditions'}];const el=document.getElementById('cards');function render(items){el.innerHTML='';items.forEach((it)=>{el.insertAdjacentHTML('beforeend', `<div class=\"card\"><h4>${it.t}</h4><p>${it.m}</p><span class=\"tag\">Live</span></div>`)})}render(data);document.getElementById('shuffle').onclick=()=>{const arr=[...data].sort(()=>Math.random()-0.5);render(arr)}document.getElementById('theme').onclick=()=>{document.body.style.filter=document.body.style.filter? '':'saturate(1.2) brightness(1.02)';};</script></body></html>
